name: Caçador de Vagas

on:
  schedule:
    # de hora em hora, aos 15 minutos. Horário do agendamento é UTC.
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cacador-de-vagas
  cancel-in-progress: false

jobs:
  garimpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Testar o filtro
        run: npm test

      - name: Buscar e postar
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node src/index.js

      - name: Guardar o que já foi postado
        run: |
          if [ -n "$(git status --porcelain data/vistos.json)" ]; then
            git config user.name  'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/vistos.json
            git commit -m "chore: atualiza vagas já postadas"
            git push
          else
            echo "nada novo"
          fi
